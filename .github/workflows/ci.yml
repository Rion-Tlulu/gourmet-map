name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit / GAS tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Syntax check
        run: |
          for file in js/*.js test/*.js; do node --check "$file"; done
          cat gas/Code.gs gas/Operations.gs > /tmp/gas-check.js
          node --check /tmp/gas-check.js

      - name: Run tests
        run: node --test "test/*.test.js"

  tailwind:
    name: Tailwind CSS is up to date
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Tailwind standalone CLI (v3.4.17)
        run: |
          curl -sSL -o tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64
          chmod +x tailwindcss

      - name: Build and compare
        run: |
          ./tailwindcss -c tailwind/tailwind.config.js -i tailwind/input.css -o /tmp/app.css --minify
          diff -q /tmp/app.css css/app.css || (echo "css/app.css を再生成してください" && exit 1)

  # 秘密情報の漏洩検査（SEC-06）
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
